<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Page Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Summarizer</h1>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </header>

    <div id="pageTitle" class="page-title" aria-live="polite"></div>

    <div class="controls">
      <button id="summarizeBtn" class="primary-btn">Summarize Page</button>
      <button id="clearBtn" class="secondary-btn" disabled>Clear</button>
    </div>

    <label class="toggle-row">
      <input type="checkbox" id="briefMode" />
      <span>3-bullet summary</span>
    </label>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <div id="spinner" class="spinner" hidden aria-label="Loading…">
      <div class="spin"></div>
      <span>Summarizing…</span>
    </div>

    <div id="output" class="output" hidden>
      <section aria-labelledby="summaryHeading">
        <h2 id="summaryHeading">Summary</h2>
        <ul id="summaryList" class="bullet-list"></ul>
      </section>

      <section aria-labelledby="insightsHeading">
        <h2 id="insightsHeading">Key Insights</h2>
        <ul id="insightsList" class="bullet-list"></ul>
      </section>

      <div class="meta-row">
        <span id="readingTime" class="badge"></span>
        <span id="wordCount" class="badge"></span>
        <button id="copyBtn" class="icon-btn" title="Copy summary" aria-label="Copy summary to clipboard">📋 Copy</button>
      </div>
    </div>


  </div>
  <script src="popup.js"></script>
</body>
</html>
