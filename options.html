<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Summarizer Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; color: #18181b; }
    h1 { font-size: 18px; margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 12px; border: 1px solid #d4d4d8;
      border-radius: 8px; font-size: 14px; box-sizing: border-box;
    }
    input:focus { outline: 2px solid #6366f1; outline-offset: 2px; border-color: transparent; }
    button {
      margin-top: 14px; padding: 9px 20px; background: #6366f1; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    button:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
    #msg { margin-top: 12px; font-size: 13px; color: #16a34a; min-height: 18px; }
    .hint { font-size: 12px; color: #71717a; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>⚙ Summarizer Settings</h1>
  <label for="apiKey">Gemini API Key</label>
  <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
  <p class="hint">Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a>. Your key is stored locally and never shared.</p>
  <button id="saveBtn">Save</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
